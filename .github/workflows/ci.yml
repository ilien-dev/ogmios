name: ci

on:
  push:
  pull_request:

jobs:
  # Merging to main releases package.json's version, so a PR must raise it.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - run: bun scripts/version.ts check "$(git show FETCH_HEAD:package.json | jq -r .version)"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev
      - run: bun install --frozen-lockfile
      - run: bun run sidecar:build
      - run: bun run check

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Speech recogniser (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: scripts/build-parakeet.sh
      - run: bun install --frozen-lockfile
      - run: bun run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: ogmios-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
