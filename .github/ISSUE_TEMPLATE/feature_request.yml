name: Feature request
description: Propose one improvement to Ogmios.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue. Ogmios is a desktop app for macOS and Windows to practice spoken English with Claude: you talk, nobody corrects you mid-sentence, and at the end you get one thing to focus on. Ideas outside that purpose will be declined.
        Search the [issues](https://github.com/ilien-dev/ogmios/issues?q=is%3Aissue) and [pull requests](https://github.com/ilien-dev/ogmios/pulls?q=is%3Apr) first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How it would be measured
      description: The number that should move, and how to read it before and after.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and pull requests and nobody proposed this yet.
          required: true
        - label: This is a single idea, not several in one issue.
          required: true
        - label: I would like to send the pull request myself.
