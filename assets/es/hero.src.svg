<!--brief
Sentence: an adult learning English talks with an AI partner who never stops them to correct a mistake, then gets one thing to work on in their own language, and learns the words of their own books before reading them.
Flow: the learner speaks -> Ogmios turns the voice into text and the partner answers, no corrections -> after the talk: one focus, a word from their book, the day it comes back.
Real input: the conversation "A small win at work this week" and the learner's line "Honestly, I did a big effort" (docs/screenshots/conversation.png).
Real output: focus "I did a big effort -> I made a big effort" (one focus per report, docs/SPEC.md, CLAUDE.md product rules); word "tumble" with Alice's own line "...think nothing of tumbling down stairs!" (book vocabulary, README); "Back in 1 day" (src-tauri/src/memory/recall.rs DAYS = [1, 3, 7, 21, 60]).
Features: Nobody interrupts you (README, product rules); Feedback after you speak (README); Words from your own books (README); Your voice stays on your computer (README, local speech recognition).
Unfinished left out: none found by readme.py survey.
No strip: fewer than five true facts remain once the features, the description and the badges are struck.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Ogmios. Habla inglés sin miedo y aprende al terminar. Hablas al micrófono; un portátil con Ogmios muestra la conversación, A small win at work, donde tu compañero responde sin corregirte. Después salen tres tarjetas: tu foco, I did a big effort pasa a I made a big effort; una palabra de tu libro, tumble, con la frase de Alicia; y el día en que vuelve, en 1 día.">
<style>
/* 12 s  voice   |go|
         you        |in|====================================|out|
         reply           |in|===============================|out|
         p1                   |go|
         card1                   |lit|=========================|
         p2                             |go|
         card2                             |lit|===============|
         p3                                       |go|
         card3                                       |lit|=====|   */
@keyframes voice{0%,1%{transform:translateY(0);opacity:0}2.5%{opacity:1}8%{transform:translateY(84px);opacity:1}10%,100%{transform:translateY(84px);opacity:0}}
@keyframes you{0%,8%{opacity:0;transform:translateY(12px)}12%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(12px)}}
@keyframes reply{0%,20%{opacity:0;transform:translateY(12px)}24%,94%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(12px)}}
@keyframes hop1{0%,29%{transform:translate(0,0);opacity:0}30.5%{opacity:1}37%{transform:translate(28px,-87px);opacity:1}39%,100%{transform:translate(28px,-87px);opacity:0}}
@keyframes hop2{0%,44%{transform:translate(0,0);opacity:0}45.5%{opacity:1}52%{transform:translate(28px,33px);opacity:1}54%,100%{transform:translate(28px,33px);opacity:0}}
@keyframes hop3{0%,59%{transform:translate(0,0);opacity:0}60.5%{opacity:1}67%{transform:translate(28px,125px);opacity:1}69%,100%{transform:translate(28px,125px);opacity:0}}
@keyframes lit1{0%,35%{opacity:.55}39%,96%{opacity:1}100%{opacity:.55}}
@keyframes lit2{0%,50%{opacity:.55}54%,96%{opacity:1}100%{opacity:.55}}
@keyframes lit3{0%,65%{opacity:.55}69%,96%{opacity:1}100%{opacity:.55}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes turn{0%{transform:translateY(32px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-32px);opacity:0}}
.voice{animation:voice 12s cubic-bezier(.4,0,.2,1) infinite}
.you{animation:you 12s cubic-bezier(0,0,.2,1) infinite}
.reply{animation:reply 12s cubic-bezier(0,0,.2,1) infinite}
.hop1{animation:hop1 12s cubic-bezier(.4,0,.2,1) infinite}
.hop2{animation:hop2 12s cubic-bezier(.4,0,.2,1) infinite}
.hop3{animation:hop3 12s cubic-bezier(.4,0,.2,1) infinite}
.lit1{animation:lit1 12s ease-in-out infinite}
.lit2{animation:lit2 12s ease-in-out infinite}
.lit3{animation:lit3 12s ease-in-out infinite}
.wave{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.caret{animation:caret 1.1s steps(1,end) infinite}
.flow{animation:flow 1.2s linear infinite}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}
</style>
<defs>
<radialGradient id="g0" cx="0.34" cy="0.3" r="0.962"><stop offset="0.12" stop-color="$orb_warm"/><stop offset="0.42" stop-color="$orb_warm" stop-opacity="0"/></radialGradient>
<radialGradient id="g1" cx="0.7" cy="0.36" r="0.948"><stop offset="0.1" stop-color="$orb_blue"/><stop offset="0.52" stop-color="$orb_blue" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.44" cy="0.76" r="0.944"><stop offset="0.08" stop-color="$orb_pink"/><stop offset="0.5" stop-color="$orb_pink" stop-opacity="0"/></radialGradient>
<radialGradient id="g3" cx="0.78" cy="0.78" r="1.103"><stop offset="0.06" stop-color="$orb_violet"/><stop offset="0.46" stop-color="$orb_violet" stop-opacity="0"/></radialGradient>
<g id="orb"><circle cx="30" cy="30" r="30" fill="$orb_base"/><circle cx="30" cy="30" r="30" fill="url(#g3)"/><circle cx="30" cy="30" r="30" fill="url(#g2)"/><circle cx="30" cy="30" r="30" fill="url(#g1)"/><circle cx="30" cy="30" r="30" fill="url(#g0)"/></g>
<clipPath id="feat"><rect x="792" y="444" width="460" height="48"/></clipPath>
</defs>
<rect width="1280" height="640" fill="$bg"/>
<g id="backdrop" data-backdrop="plus still"><defs><pattern id="bd-plus" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M14 18H22M18 14V22" fill="none" stroke="$line" stroke-width="1.5" stroke-linecap="round"/></pattern></defs><rect x="-36" y="-36" width="1352" height="712" fill="url(#bd-plus)"/></g>

<g transform="translate(0 40)">
<g id="logo" transform="translate(792 136) scale(0.9333)"><use href="#orb"/><g transform="translate(-2 -2)" fill="none" stroke-width="8" stroke-linecap="round"><path d="M19.5 37A13.5 13.5 0 0 1 37 19.5" stroke="$mark_a"/><path d="M44.5 27A13.5 13.5 0 0 1 27 44.5" stroke="$mark_b"/></g></g>
<text id="name" class="b" x="862" y="176" font-size="34" fill="$ink">Ogmios</text>
<text id="tagline" class="b" font-size="42" fill="$ink"><tspan x="792" y="274">Habla inglés sin miedo.</tspan><tspan x="792" y="326" fill="$accent">Aprende al terminar.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="792" y="378">Una app gratis para tu ordenador. Habla con</tspan><tspan x="792" y="406">Claude y recibe una cosa que mejorar.</tspan></text>
<g id="facts"><g clip-path="url(#feat)">
<g class="turn" style="animation-delay:-1.5s"><circle cx="800" cy="468" r="6" fill="$accent"/><text x="818" y="475" class="s" font-size="20" fill="$ink">Nadie te interrumpe</text></g>
<g class="turn" opacity="0" style="animation-delay:-10.5s"><circle cx="800" cy="468" r="6" fill="$accent"/><text x="818" y="475" class="s" font-size="20" fill="$ink">La corrección, al terminar</text></g>
<g class="turn" opacity="0" style="animation-delay:-7.5s"><circle cx="800" cy="468" r="6" fill="$accent"/><text x="818" y="475" class="s" font-size="20" fill="$ink">Palabras de tus propios libros</text></g>
<g class="turn" opacity="0" style="animation-delay:-4.5s"><circle cx="800" cy="468" r="6" fill="$accent"/><text x="818" y="475" class="s" font-size="20" fill="$ink">Tu voz no sale de tu ordenador</text></g>
</g></g>
</g>
