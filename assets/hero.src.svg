<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Ogmios: your voice flows in from the left as a sound wave, the verbs of your book (tumbled, gave up, curtseyed) flow in from the right, and both meet in the Ogmios orb. Speak with Claude. Learn the verbs of your book.">
<style>
@keyframes n-travel{from{transform:translateX(0)}to{transform:translateX(480px)}}
@keyframes n-verbs{from{transform:translateX(0)}to{transform:translateX(-920px)}}
@keyframes n-va{0%,100%{transform:scaleY(.3)}25%{transform:scaleY(1)}55%{transform:scaleY(.45)}80%{transform:scaleY(.85)}}
@keyframes n-vb{0%,100%{transform:scaleY(.75)}30%{transform:scaleY(.2)}60%{transform:scaleY(1)}85%{transform:scaleY(.4)}}
@keyframes n-vc{0%,100%{transform:scaleY(.5)}20%{transform:scaleY(.9)}45%{transform:scaleY(.25)}75%{transform:scaleY(1)}}
@keyframes n-ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
@keyframes n-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.n-travel{animation:n-travel 16s linear infinite}
.n-verbs{animation:n-verbs 30s linear infinite}
.n-a,.n-b,.n-c{transform-box:fill-box;transform-origin:center}
.n-a{animation:n-va 1.5s ease-in-out infinite}
.n-b{animation:n-vb 1.9s ease-in-out infinite}
.n-c{animation:n-vc 1.2s ease-in-out infinite}
.n-ring{animation:n-ring 3s linear infinite;transform-box:fill-box;transform-origin:center}
.n-breathe{animation:n-breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
