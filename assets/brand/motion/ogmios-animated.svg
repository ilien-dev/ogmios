<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<style>
.line{animation:talk 1.1s cubic-bezier(.45,0,.2,1) both}
.focus{transform-box:fill-box;transform-origin:center;animation:land .35s 1.05s cubic-bezier(.3,1.6,.5,1) both}
@keyframes talk{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
@keyframes land{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line,.focus{animation:none}}
</style>
