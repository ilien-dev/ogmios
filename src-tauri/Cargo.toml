[package]
name = "ogmios"
version = "0.4.0"
description = "Conversation practice for English learners, with feedback at the end"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ogmios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
# In-app updates from the GitHub release's latest.json.
tauri-plugin-updater = "2"
# The native file picker for adding a book; Rust reads the chosen path.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Microphone capture; audio stays in this process.
cpal = "0.16"
# The speech recogniser is opened at run time, see stt/engine.rs.
libloading = "0.8"
# Recordings kept for review, 16 kHz mono PCM.
hound = "3.5"
# Model downloads, over the OS trust store.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# The API key lives in the OS credential store, never in SQLite.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# Books: an EPUB is a zip of XHTML documents.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
percent-encoding = "2"
# Books: PDF text, bookmarks and page order. No dates or threads needed.
lopdf = { version = "0.42", default-features = false }
# Reading aloud: Kokoro on the CPU. Prebuilt libraries, linked in.
sherpa-onnx = "1.13.8"
rust-stemmers = "1.2.0"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
